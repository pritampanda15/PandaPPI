[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pandappi"
version = "2.0.0"
description = "A tool for mapping protein-protein, protein-nucleic acid, and antigen-antibody interactions"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
        {name = "Dr. Pritam Kumar Panda", email = "pritam@stanford.edu"}
]
keywords = ["bioinformatics", "protein interactions", "nucleic acids", "antibodies"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry"
]

dependencies = [
    "biopython>=1.79",
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "matplotlib>=3.5.0",
    "py3Dmol>=0.9.0",
    "networkx>=2.6.0",
    "scikit-learn>=0.24.0",
    "scipy>=1.7.0"
]

[project.scripts]
pandappi = "pandappi.main:main"

[project.urls]
"Homepage" = "https://github.com/pritampanda15/PandaPPI"
"Bug Tracker" = "https://github.com/pritampanda15/PandaPPI/issues"


[tool.long_description]
long-description = "file:README.md"
long-description-content-type = "text/markdown"

[tool.setuptools.packages.find]
include = ["pandappi*"]