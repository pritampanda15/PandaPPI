[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pandappi"
dynamic = ["version"]
description = "Map and visualize every contact at protein-protein, protein-peptide, antibody-antigen and protein-nucleic acid interfaces"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Dr. Pritam Kumar Panda", email = "pritam@stanford.edu"}
]
keywords = ["bioinformatics", "structural biology", "protein-protein interactions", "interface",
            "peptide", "antibody", "nucleic acids", "PDB"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "biopython>=1.79",
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "matplotlib>=3.5.0",
    "py3Dmol>=0.9.0",
    "networkx>=2.6.0",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
pandappi = "pandappi.main:main"

[project.urls]
Homepage = "https://github.com/pritampanda15/PandaPPI"
Documentation = "https://github.com/pritampanda15/PandaPPI#readme"
Issues = "https://github.com/pritampanda15/PandaPPI/issues"

[tool.setuptools.dynamic]
version = {attr = "pandappi.__version__"}

[tool.setuptools.packages.find]
include = ["pandappi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
